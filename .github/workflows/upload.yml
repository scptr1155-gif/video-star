name: Upload Video to vid.link

on:
  repository_dispatch:
    types: [upload_video]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Videoyu İndir
        run: |
          mkdir -p videos/vid.link
          curl -L -o videos/vid.link/${{ github.event.client_payload.video_id }}.mp4 "${{ github.event.client_payload.video_url }}"

      - name: Links Dosyasını Güncelle
        run: |
          if [ ! -f links ]; then touch links; fi
          echo "https://raw.githubusercontent.com/scptr1155-gif/video-star/main/videos/vid.link/${{ github.event.client_payload.video_id }}.mp4" >> links

      - name: Değişiklikleri GitHub'a Kaydet (Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Yeni video eklendi: ${{ github.event.client_payload.video_id }}"
          git push
