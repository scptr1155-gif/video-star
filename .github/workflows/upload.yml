name: Move Video to vid.link

on:
  repository_dispatch:
    types: [move_video_to_folder]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Videoyu Release'den İndir ve Klasöre Koy
        run: |
          mkdir -p videos/vid.link
          curl -L -o videos/vid.link/${{ github.event.client_payload.video_id }}.mp4 "https://github.com/${{ github.repository }}/releases/download/${{ github.event.client_payload.tag_name }}/${{ github.event.client_payload.video_id }}.mp4"

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Yeni video vid.link klasörüne eklendi: ${{ github.event.client_payload.video_id }}"
          git push
