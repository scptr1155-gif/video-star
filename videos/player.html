<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>
<style>
  html, body { margin: 0; height: 100%; background-color: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  video { width: 100%; height: 100%; outline: none; background: #000; }

  /* ✨ Yeni ve Modern Yükleme Ekranı (Neon Efektli) */
  .loader-container {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .loader-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 4px solid transparent;
    border-top-color: #6366f1;
    border-bottom-color: #a855f7;
    border-radius: 50%;
    animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
  }
  .loader-ring:nth-child(2) {
    width: 80%;
    height: 80%;
    border-top-color: #a855f7;
    border-bottom-color: #6366f1;
    animation: spin-reverse 1.5s linear infinite;
  }
  .loader-text {
    color: #fff;
    font-weight: 600;
    letter-spacing: 2px;
    font-size: 0.8rem;
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .spinner-bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-reverse { to { transform: rotate(-360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }

  /* Hata Ekranı */
  .msg { color: #fff; text-align: center; padding: 40px; background: rgba(255, 255, 255, 0.05); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 600px; }
  .msg h2 { color: #f87171; margin-top: 0; }
  .msg code { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; color: #a5b4fc; }
</style>
</head>
<body>
<div id="wrap"></div>

<script>
// ==== AYARLAR ====
const CONFIG = {
  user:   'scptr1155-gif',
  repo:   'video-star',
  // Videolarını en son hangi etikete (sürüme) yüklediysen onu en başa yaz!
  // Örneğin en son v2'ye yüklediysen, v2'yi en başa al ki anında bulsun.
  releaseTags: ['v2', 'v1'] 
};
// =================

const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const videoId = params.get('id');

function showError(title, detail) {
  wrap.innerHTML = `<div class="msg"><h2>⚠️ ${title}</h2><p>${detail}</p></div>`;
}

function showLoader() {
  wrap.innerHTML = `
    <div class="loader-container">
      <div class="spinner-bg"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-text">Yükleniyor</div>
    </div>`;
}

async function findAndPlayVideo() {
  if (!videoId) return showError('Video ID Eksik', 'Kullanım: <code>player.html?id=video1</code>');

  showLoader();

  let foundUrl = null;
  // Hız için sadece mp4 arıyoruz. Farklı formatta video yüklersen buraya ekleyebilirsin.
  const ext = 'mp4'; 

  // Aynı anda tüm etiketleri kontrol et (çok daha hızlı!)
  const promises = CONFIG.releaseTags.map(async (tag) => {
    const testUrl = `https://github.com/${CONFIG.user}/${CONFIG.repo}/releases/download/${tag}/${videoId}.${ext}`;
    try {
      const res = await fetch(testUrl, { method: 'HEAD' });
      if (res.ok) return testUrl; // Bulunduysa linki dön
    } catch (e) {}
    return null;
  });

  // İlk dönen geçerli linki al
  const results = await Promise.all(promises);
  foundUrl = results.find(url => url !== null);

  if (foundUrl) {
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.src = foundUrl;
    
    // Video oynamaya başlamak için hazır olduğunda loader'ı kaldır
    video.addEventListener('loadeddata', () => {
      wrap.innerHTML = '';
      wrap.appendChild(video);
    });
    
    video.addEventListener('error', () => showError('Oynatma Hatası', 'Dosya bulundu ancak tarayıcı oynatamadı.'));
  } else {
    showError('Video Bulunamadı', `<b>"${videoId}.mp4"</b> adında bir video bulunamadı.<br><br>Lütfen videonun adını ve Releases'e yüklendiğinden emin ol.`);
  }
}

findAndPlayVideo();
</script>
</body>
</html>
