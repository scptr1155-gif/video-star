<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
  .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: #fff; text-align: center; padding: 20px; line-height: 1.6; }
  .msg h2 { color: #f87171; }
  .msg code { background: #1a1a24; padding: 4px 8px; border-radius: 6px; color: #a5b4fc; font-size: 0.9em; word-break: break-all; }
</style>
</head>
<body>
<div id="wrap"></div>

<script>
// ==== AYARLAR ====
const CONFIG = {
  user:   'scptr1155-gif',
  repo:   'video-star',
  branch: 'main'
};
// =========================================

const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const videoId = params.get('id');

function showError(title, detail) {
  wrap.innerHTML = `<div class="msg"><h2>${title}</h2><p>${detail}</p></div>`;
}

async function loadVideo() {
  if (!videoId) return showError('Video ID Eksik', 'Kullanım: <code>player.html?id=video1</code>');

  wrap.innerHTML = `<div class="spinner"></div>`;

  try {
    // 1. 'links' dosyasını GitHub Raw'dan çek
    const linksUrl = `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/links`;
    const response = await fetch(linksUrl);
    
    if (!response.ok) throw new Error('links dosyası bulunamadı.');
    const text = await response.text();
    
    // 2. Satır satır oku ve aranan ID'yi bul
    let videoUrl = null;
    const lines = text.split('\n');
    
    for (let line of lines) {
      line = line.trim(); // Boşlukları temizle
      if (!line) continue;
      
      // Eğer satır aranan ID'yi içeriyorsa (örneğin 'a.mp4')
      if (line.includes(videoId)) {
        videoUrl = line;
        break;
      }
    }

    if (!videoUrl) {
      throw new Error(`"${videoId}" ID'sine ait bir link 'links' dosyasında bulunamadı.`);
    }

    // 3. Video elementini oluştur ve çal
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = videoUrl;

    video.addEventListener('loadedmetadata', () => {
      wrap.innerHTML = '';
      wrap.appendChild(video);
    });

    video.addEventListener('error', () => {
      showError('Video Oynatılamadı', `Link doğru ama video yüklenemedi:<br><code>${videoUrl}</code>`);
    });

  } catch (err) {
    showError('Hata Oluştu', err.message);
  }
}

loadVideo();
</script>
</body>
</html>
