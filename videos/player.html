<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>
<style>
  html, body { margin: 0; height: 100%; background-color: #0a0a0f; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  video { width: 100%; height: 100%; outline: none; background: #000; }
  .spinner-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
  .spinner { width: 50px; height: 50px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
  .spinner-text { color: #a5b4fc; font-size: 0.9rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { color: #fff; text-align: center; padding: 40px; background: rgba(255, 255, 255, 0.05); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 600px; }
  .msg h2 { color: #f87171; margin-top: 0; }
  .msg code { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; color: #a5b4fc; }
</style>
</head>
<body>
<div id="wrap"></div>

<script>
// ==== AYARLAR ====
const CONFIG = {
  user:   'scptr1155-gif',
  repo:   'video-star',
  // Sürüm etiketlerini sırayla dener (v1, v2, v3...)
  releaseTags: ['v1', 'v2', 'v3', 'v4', 'v5'] 
};
// =================

const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const videoId = params.get('id'); // Örn: video1

function showError(title, detail) {
  wrap.innerHTML = `<div class="msg"><h2>⚠️ ${title}</h2><p>${detail}</p></div>`;
}

async function findAndPlayVideo() {
  if (!videoId) return showError('Video ID Eksik', 'Kullanım: <code>player.html?id=video1</code>');

  wrap.innerHTML = `
    <div class="spinner-container">
      <div class="spinner"></div>
      <div class="spinner-text">Video Aranıyor ve Yükleniyor...</div>
    </div>`;

  let foundUrl = null;
  const extensions = ['mp4', 'webm', 'mov'];

  // Sürümleri ve uzantıları sırayla dene
  for (let tag of CONFIG.releaseTags) {
    for (let ext of extensions) {
      const testUrl = `https://github.com/${CONFIG.user}/${CONFIG.repo}/releases/download/${tag}/${videoId}.${ext}`;
      
      try {
        // Sadece dosyanın var olup olmadığını kontrol et (HEAD isteği)
        const res = await fetch(testUrl, { method: 'HEAD' });
        if (res.ok) {
          foundUrl = testUrl;
          break; // Bulunduysa döngüden çık
        }
      } catch (e) {
        // Hata olursa devam et
      }
    }
    if (foundUrl) break; 
  }

  if (foundUrl) {
    // Video bulundu, oynat
    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.src = foundUrl;

    video.addEventListener('loadeddata', () => {
      wrap.innerHTML = '';
      wrap.appendChild(video);
    });
    
    video.addEventListener('error', () => showError('Oynatma Hatası', 'Dosya bulundu ancak tarayıcı oynatamadı.'));

  } else {
    showError('Video Bulunamadı', `
      <b>"${videoId}"</b> adında bir video Releases bölümünde bulunamadı.<br><br>
      Lütfen şunlardan emin ol:<br>
      1. Videonun adı tam olarak <code>${videoId}.mp4</code> (veya webm) mi?<br>
      2. Videon bir Release (Sürüm) olarak yayınlandı mı?
    `);
  }
}

findAndPlayVideo();
</script>
</body>
</html>
