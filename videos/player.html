<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>
<style>
  html, body { margin: 0; height: 100%; background-color: #050508; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  video { width: 100%; height: 100%; outline: none; background: #000; }

  /* ✨ Daha Akıcı ve Modern Yükleme Ekranı */
  .loader-container { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
  .glow { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, transparent 70%); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  .spinner { position: absolute; width: 100%; height: 100%; border: 3px solid transparent; border-top-color: #6366f1; border-right-color: #8b5cf6; border-radius: 50%; animation: spin 1s linear infinite; }
  .spinner-inner { position: absolute; width: 70%; height: 70%; border: 3px solid transparent; border-bottom-color: #a5b4fc; border-radius: 50%; animation: spin-reverse 1.5s linear infinite; }
  .text { color: #a5b4fc; font-size: 0.85rem; letter-spacing: 2px; font-weight: 600; position: absolute; bottom: -40px; animation: pulse 1.5s ease-in-out infinite; text-transform: uppercase; }
  
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
  @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }

  .msg { color: #fff; text-align: center; padding: 40px; background: rgba(255, 255, 255, 0.03); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  .msg h2 { color: #f87171; margin-top: 0; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .msg code { background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 8px; color: #a5b4fc; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div id="wrap"></div>

<script>
// ==== AYARLAR ====
const CONFIG = {
  user:   'scptr1155-gif',
  repo:   'video-star',
  // Videonu en son hangi sürüme (etiket) yüklediysen onu en başa yaz.
  releaseTags: ['v1', 'v2', 'v3'] 
};
// =================

const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const videoId = params.get('id');

function showLoader() {
  wrap.innerHTML = `
    <div class="loader-container">
      <div class="glow"></div>
      <div class="spinner"></div>
      <div class="spinner-inner"></div>
      <div class="text">Yükleniyor</div>
    </div>`;
}

function showError(detail) {
  wrap.innerHTML = `<div class="msg"><h2>⚠️ Video Bulunamadı</h2><p>${detail}</p></div>`;
}

function playVideo() {
  if (!videoId) return showError('Lütfen bir video ID girin.<br>Kullanım: <code>?id=video1</code>');

  showLoader();

  // Videosu aranacak sürümler
  const tags = CONFIG.releaseTags;
  let currentIndex = 0;

  function tryNextTag() {
    if (currentIndex >= tags.length) {
      return showError(`"${videoId}.mp4" adında bir video hiçbir sürümde bulunamadı.`);
    }

    const tag = tags[currentIndex];
    // Doğrudan mp4 linki oluştur (CORS kontrolü yok, direkt yüklemeye çalışır)
    const videoUrl = `https://github.com/${CONFIG.user}/${CONFIG.repo}/releases/download/${tag}/${videoId}.mp4`;

    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.preload = 'auto'; // Hemen indirmeye başla
    
    // Video başarıyla yüklendiğinde
    video.addEventListener('loadeddata', () => {
      wrap.innerHTML = '';
      wrap.appendChild(video);
    });

    // Hata olursa (dosya o sürümde yoksa) bir sonraki sürümü dene
    video.addEventListener('error', () => {
      currentIndex++;
      tryNextTag();
    });

    video.src = videoUrl;
    video.load();
  }

  tryNextTag();
}

playVideo();
</script>
</body>
</html>
